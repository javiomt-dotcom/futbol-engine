<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futbol Engine</title>
<meta name="theme-color" content="#0d1512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0d1512;--card:#16211c;--line:#27362f;--text:#eef5f1;--muted:#93a69c;--green:#3ddc84;--yellow:#f2c94c;--red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
small,.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.leg,.bet{padding:10px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pick{font-weight:650}
.pct{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;border-radius:3px}
.stats{display:flex;gap:24px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
label{display:block;margin-top:14px;font-size:14px;color:var(--muted)}
input{width:100%;margin-top:6px;padding:12px;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus{outline:2px solid var(--green);outline-offset:1px}
.verdict{margin-top:8px;font-size:14px;font-weight:600;min-height:20px}
.good{color:var(--green)}.bad{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:500;text-align:right;padding:0 0 8px 8px}
td{padding:9px 0 9px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0}
.neg{color:var(--red)}
.note{border-color:var(--yellow)}
.stats b small{display:block;font-size:12px;font-weight:400}
.stats.first{margin-top:0;padding-top:0;border-top:0}
details.day{padding:0 16px}
details.day summary{cursor:pointer;padding:14px 0;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;list-style:none}
details.day summary::-webkit-details-marker{display:none}
details.day[open]{padding-bottom:8px}
.sub{margin:6px 0 0 18px}
.sub .row{font-size:14px}
.sub small{display:block;margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{margin:0;flex:0 0 auto;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.tabs button[aria-selected="true"]{background:var(--green);color:var(--bg);border-color:var(--green)}
button{font:inherit;font-weight:600;color:var(--bg);background:var(--green);border:0;border-radius:10px;padding:10px 16px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<main>
  <header><h1>Futbol Engine</h1><small id="updated"></small></header>
  <div id="app"><p class="muted">Cargando selecciones...</p></div>
</main>
<script>
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = p => (p * 100).toFixed(1) + "%";
const color = p => p >= .8 ? "var(--green)" : p >= .6 ? "var(--yellow)" : "var(--red)";
const meter = p => `<div class="meter"><i style="width:${p * 100}%;background:${color(p)}"></i></div>`;

function when(x) {
  if (!x.kickoff) return x.date;
  return new Date(x.kickoff).toLocaleString("es", {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
}
function open(list, now) {
  // Sin hora conocida, sólo se conserva hasta el final de su día.
  return list.filter(x => (x.kickoff ? new Date(x.kickoff) : new Date(x.date + "T23:59:59")) > now);
}
function parlayCard(title, legs, id) {
  if (legs.length === 0) return `<div class="card"><h3>${title}</h3><p class="muted">Todavía no hay suficientes partidos por empezar para armarlo.</p></div>`;
  const p = legs.reduce((a, x) => a * x.p, 1), min = 1 / p;
  return `<div class="card"><h3>${title}</h3>
    ${legs.map(x => `<div class="leg"><div class="row"><span class="pick">${esc(x.pick)}</span><span class="pct">${pct(x.p)}</span></div>
      <small>${esc(x.home)} vs ${esc(x.away)} · ${esc(when(x))}</small></div>`).join("")}
    <div class="stats"><div><small>Probabilidad</small><b>${pct(p)}</b></div><div><small>Momio mínimo</small><b>${min.toFixed(2)}</b></div></div>
    <label for="${id}">¿Cuánto paga tu casa? (momio decimal)</label>
    <input id="${id}" inputmode="decimal" placeholder="Ej. ${(min + .1).toFixed(2)}" data-min="${min}">
    <div class="verdict" id="${id}-v" aria-live="polite"></div></div>`;
}
const MARK = {ganado: ["✓", "good", "Se cumplió"], perdido: ["✗", "bad", "No se cumplió"], pendiente: ["·", "muted", "Pendiente"], "sin resultado": ["–", "muted", "Sin resultado"], anulado: ["↺", "muted", "Se devolvió"]};
const mark = s => `<span class="${MARK[s][1]}" title="${MARK[s][2]}">${MARK[s][0]}</span>`;
function tally(t) {
  const n = t.ganado + t.perdido;
  return `<b>${t.ganado}/${n}</b><small>${n ? Math.round(100 * t.ganado / n) + "% se cumplió" : "aún sin calificar"}${t.pendiente ? " · " + t.pendiente + " pendientes" : ""}</small>`;
}
const ORDER = ["todas", "futbol", "champions", "nfl", "mlb"];
let data = null, sport = "todas";
// Cuándo publica cada fuente los próximos partidos. La app se actualiza a las 07:00, 12:00 y 18:00 UTC.
const WHEN = {
  todas: "Aparecen en cuanto alguno de los deportes tenga partidos por jugar en los próximos días.",
  futbol: "La fuente publica los partidos de fin de semana entre el jueves y el viernes, y los de entre semana uno o dos días antes. Aparecen en la primera actualización después de eso (la app se actualiza 3 veces al día).",
  champions: "Aparecen la semana de cada jornada, hasta 7 días antes del partido.",
  nfl: "La semana siguiente se publica con sus líneas el lunes o martes. Aparecen en la primera actualización después de eso.",
  mlb: "Aparecen desde el día en que vuelve la temporada.",
};
try { sport = localStorage.getItem("sport") || sport; } catch (e) {}
const sportOf = x => x.sport || "futbol";
function recordSection(d) {
  const rec = (d.record || []).filter(e => sport === "todas" || sportOf(e) === sport).reverse(), sum = (d.record_summary || {})[sport];
  if (!rec.length || !sum) return `<h2>Lo que te recomendé</h2><div class="card"><p class="muted">Aquí aparecerá cada recomendación con su resultado.</p></div>`;
  const days = {};
  rec.forEach(e => (days[e.made] = days[e.made] || []).push(e));
  const day = s => { const t = new Date(s + "T12:00:00").toLocaleDateString("es", {weekday: "long", day: "numeric", month: "long"}); return t[0].toUpperCase() + t.slice(1); };
  const legLine = x => `<div class="row"><span>${mark(x.status)} ${esc(x.pick)}</span><span class="pct">${x.score ? esc(x.score) : pct(x.p)}</span></div>
    <small>${esc(x.home)} vs ${esc(x.away)} · ${esc(x.league)}</small>`;
  const entry = e => e.type === "single"
    ? `<div class="bet">${legLine(e.legs[0])}</div>`
    : `<div class="bet"><div class="row"><span class="pick">${mark(e.status)} Parlay ${e.type === "parlay_top" ? "más probable" : "intermedio"}</span><span class="pct">${pct(e.legs.reduce((a, x) => a * x.p, 1))}</span></div>
       <div class="sub">${e.legs.map(legLine).join("")}</div></div>`;
  return `<h2>Lo que te recomendé</h2>
    <div class="card"><div class="stats first"><div><small>Individuales</small>${tally(sum.singles)}</div><div><small>Parlays</small>${tally(sum.parlays)}</div></div>
    <p class="muted">✓ se cumplió · ✗ no se cumplió · ↺ se devolvió (empate con la línea) · · pendiente. El número de la derecha es el marcador final o, si no se ha jugado, la probabilidad.</p></div>
    ${Object.entries(days).map(([k, es]) => `<details class="card day"${k === rec[0].made ? " open" : ""}><summary>${esc(day(k))}
      <small>${es.filter(e => e.status === "ganado").length}/${es.filter(e => e.status === "ganado" || e.status === "perdido").length}</small></summary>
      ${es.filter(e => e.type !== "single").map(entry).join("")}${es.filter(e => e.type === "single").sort((a, b) => b.legs[0].p - a.legs[0].p).map(entry).join("")}</details>`).join("")}`;
}
function historySection(h) {
  if (!h) return "";
  const money = h.rows.some(r => r.roi !== null);
  return `<h2>Cómo le fue en ${esc(h.period)}</h2>
    <div class="card note"><table><thead><tr><th>Tipo</th><th>Cantidad</th><th>Acierto</th>${money ? "<th>ROI</th>" : ""}</tr></thead><tbody>
      ${h.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.count}</td><td>${r.hit.toFixed(1)}%</td>${money ? `<td class="${r.roi < 0 ? "neg" : "good"}">${r.roi > 0 ? "+" : ""}${r.roi.toFixed(1)}%</td>` : ""}</tr>`).join("")}
    </tbody></table>
    <p class="muted">Mucho acierto no significa ganancia: los momios de lo más probable pagan poco. ${esc(h.note)} Apuesta sólo lo que puedas perder. No es asesoría financiera.</p></div>`;
}
function render() {
  const d = data, now = new Date(), s = d.sports[sport] || {top: [], mid: []}, top = open(s.top, now), mid = open(s.mid, now);
  document.getElementById("updated").textContent = "Actualizado " + new Date(d.generated_at).toLocaleString("es", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  const legsTop = top.length >= d.legs ? top.slice(0, d.legs) : [], legsMid = mid.length >= d.legs ? mid.slice(0, d.legs) : [];
  const empty = `${s.status ? esc(s.status) : "Todavía no hay recomendaciones: no quedan partidos por empezar."}<br><br><b>¿Cuándo aparecen?</b> ${esc(WHEN[sport] || "")}`;
  app.innerHTML = `
    <nav class="tabs" role="tablist">${ORDER.filter(k => d.sports[k]).map(k => `<button role="tab" data-sport="${k}" aria-selected="${k === sport}">${esc(d.sports[k].name)}</button>`).join("")}</nav>
    <h2>Parlays</h2>
    ${parlayCard("Más probable", legsTop, "p1")}
    ${parlayCard("Intermedio", legsMid, "p2")}
    <h2>Apuestas más probables</h2>
    <div class="card">${top.length ? top.slice(0, 10).map((x, i) => `<div class="${i ? "bet" : ""}">
      <div class="row"><span class="pick">${esc(x.pick)}</span><span class="pct">${pct(x.p)}</span></div>
      <small>${esc(x.home)} vs ${esc(x.away)} · ${esc(x.league)}<br>${esc(when(x))} · mínimo ${(1 / x.p).toFixed(2)}</small>${meter(x.p)}</div>`).join("") : `<p class="muted">${empty}</p>`}</div>
    ${recordSection(d)}
    ${historySection((d.history || {})[sport])}`;
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    sport = b.dataset.sport;
    try { localStorage.setItem("sport", sport); } catch (e) {}
    render();
  });
  app.querySelectorAll("input").forEach(el => el.addEventListener("input", () => {
    const v = parseFloat(el.value.replace(",", ".")), out = document.getElementById(el.id + "-v"), min = parseFloat(el.dataset.min);
    if (!(v > 1)) { out.textContent = ""; return; }
    out.className = "verdict " + (v >= min ? "good" : "bad");
    out.textContent = v >= min ? "Paga el mínimo o más. Eso no garantiza ganancia." : "Paga menos que el mínimo: no la metas.";
  }));
}
async function load() {
  try {
    const r = await fetch("data.json", {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    if (!data.sports[sport]) sport = data.sports.todas ? "todas" : "futbol";
    render();
  } catch (e) {
    app.innerHTML = '<div class="card"><p>No se pudieron cargar las selecciones. Revisa tu conexión.</p><button id="retry">Reintentar</button></div>';
    document.getElementById("retry").onclick = load;
  }
}
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
